services:
  api-ecommerce-app:
    image: mcr.microsoft.com/devcontainers/dotnet:2-9.0
    container_name: api-ecommerce-app
    volumes:
      - ..:/workspaces/api:cached
    command: sleep infinity
    environment:
      ConnectionStrings__DefaultConnection: "Server=api-ecommerce-db,1433;Database=EcommerceDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
    depends_on:
      api-ecommerce-db:
        condition: service_healthy

  api-ecommerce-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: api-ecommerce-db
    ports:
      - "127.0.0.1:1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required}
      MSSQL_PID: "Developer"
    volumes:
      - api-ecommerce-db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  api-ecommerce-db-data:
    name: api-ecommerce-db-data
